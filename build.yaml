# Build configuration for custom Caddy packaging.
# yaml-language-server: $schema=https://json-schema.org/draft-07/schema

caddy:
  # Upstream Caddy version that xcaddy will build.
  # Accepted values:
  #   "latest"       — resolved at build time to the most recent release
  #                    tag from caddyserver/caddy on GitHub
  #   "2.11.2"       — explicit semver (with or without leading "v")
  #   "2.12.0-beta1" — pre-release tags are allowed
  # Branches, commit SHAs, and "nightly" are NOT supported because the
  # package version (deb / apk / Docker tag) needs to be a sortable semver.
  # Pin an explicit version if reproducibility matters; "latest" can move
  # between successive workflow runs.
  version: "2.11.4"
  # Suffix folded into the *package* version (not the upstream version
  # consumed by xcaddy), so the same Caddy rebuilt with different plugins
  # gets a distinct package/image version. Appended after a dot — e.g.
  # "20260508.42" produces "2.11.2.20260508.42". Safe in deb, apk, rpm, and
  # as a Docker tag.
  #   ""      — no suffix; pkg_version equals caddy.version
  #   "auto"  — <YYYYMMDD>.<git-commit-count> (default). Same commit → same
  #             version, so release.sh check can skip already-built revisions.
  #             CI must check the repo with full history (fetch-depth: 0).
  #   <other> — literal value, used verbatim (digits/letters/dots only).
  version_suffix: "auto"
# xcaddy configuration. Plugins, replacements, and flags are forwarded verbatim.
# Note: the xcaddy binary itself is pinned in lib/tools.pins.sh (version +
# SHA256) alongside yq and nfpm, not here. Same pattern as the other build
# tools so `check-updates.sh --apply` updates the version and hash atomically.
xcaddy:
  # Plugins (`--with` arguments). Each must include a version (`@vX.Y.Z` or
  # `@<commit-sha>`); bare module paths are rejected by the build guard. See
  # README for the pinning policy.
  plugins:
    - github.com/caddy-dns/cloudflare@v0.2.4
    # - github.com/mholt/caddy-l4@v0.1.0
    # - github.com/caddyserver/replace-response@v0.0.4
  # Module-level replacements (`--replace` arguments).
  replacements: []
  # - github.com/caddyserver/caddy/v2=../caddy
  # Extra flags forwarded to `xcaddy build` (rare; usually empty).
  extra_flags: []
  # Build tags (forwarded as -tags). Empty by default.
  build_tags: ""
  # Skip post-build cleanup (useful for caching). 0 or 1.
  skip_cleanup: "0"
# nfpm package metadata applied to deb and apk outputs.
package:
  name: "caddy-custom"
  description: |
    Caddy. Fast, multi-platform web server with automatic HTTPS.
    Custom build with selected plugins.
  maintainer: "Local Build <root@localhost>"
  vendor: "Custom Caddy Build"
  homepage: "https://caddyserver.com"
  license: "Apache-2.0"
  section: "web"
  priority: "optional"
  # System dependencies.
  depends_deb:
    - libc6
  depends_apk:
    - ca-certificates
  # Supplementary packages built alongside the main one.
  conflicts: []
  provides:
    - webserver
# Output formats to produce. Set to false to skip.
formats:
  binary: true
  deb: true
  apk: true
  docker: true
# Docker image options. Only used when formats.docker is true.
docker:
  # Base image is intentionally tag-pinned (not digest-pinned). The Dockerfile
  # runs `apk add` from alpine's repos, which floats independently of the base
  # digest, so a digest pin would be misleading. Container freshness is
  # achieved by the monthly Patch-Tuesday rebuild in CI, not by pinning here.
  base_image: "alpine:3.23"
  # Repository (without tag). May be local-only (e.g. "caddy-custom").
  image: "caddy-custom"
  # Tags appended to the image name. The Caddy version is always added too.
  tags:
    - "latest"
  # If true, build a multi-arch manifest. If false, build per-arch local images
  # tagged with the architecture suffix.
  multiarch_manifest: true
# Template-sync behavior. Consumed by .github/workflows/template-sync.yml
# and .forgejo/workflows/template-sync.yml. Pulls build scripts, workflows,
# templates, tests, and lib/ (logic only) from the upstream template repo
# and opens a rolling PR with any drift. The workflows auto-skip when the
# current repo IS the template (so the canonical repo never syncs itself).
#
# Files NOT replaced by the sync (always preserved locally):
#   - build.yaml          (user config)
#   - README.md           (user-customised)
#   - dist/               (managed by auto-update)
#   - lib/tools.pins.sh   (managed by auto-update)
# Everything else under the tracked paths is mirrored from upstream.
template:
  # Set to false to disable both template-sync workflows entirely.
  enabled: true
  # Canonical template source that BOTH the GitHub and Forgejo
  # template-sync workflows pull from — the two never run on the same host,
  # so a single source keeps them in lockstep. Defaults to the GitHub
  # original; point url at a mirror (e.g. https://forgejo.example.com) only
  # if a runner can't reach github.com. Self-check: if the current repo's
  # owner/repo equals `repo`, the workflow exits without doing anything, so
  # the canonical repo never syncs itself.
  url: "https://github.com"
  repo: "oltdaniel/caddy-custom"
  branch: "main"
  # Branch used for the rolling sync PR. Force-pushed on every run so the
  # PR diff always reflects current upstream; intermediate states are
  # captured in PR comments.
  branch_name: "template-sync"
# Auto-update behavior. Consumed by .github/workflows/auto-update.yml
# and .forgejo/workflows/auto-update.yml. The Phase-2 checker script
# (./check-updates.sh) is mode-agnostic; only the workflow reacts to this.
auto_update:
  # 'pr'   — open or update a rolling PR on the auto-update branch.
  # 'auto' — commit straight to main; the existing release pipeline runs.
  mode: "pr"
  # Branch used for the rolling PR. Force-pushed on every update so the
  # PR diff always reflects current build.yaml; intermediate states are
  # captured in PR comments.
  branch: "auto-update"
# Upstream dist content tracked under dist/. check-updates.sh fetches each
# tracked file from <repo_url>@<branch>, diffs against the local copy, and on
# --apply rewrites changed files plus bumps the commit pin. The pin captures
# the upstream revision the local files were last synced from — same role as
# the version pins above, applied to file content instead of binaries.
#
# Both sources are GitHub repositories. The aports entry uses the official
# GitHub mirror of gitlab.alpinelinux.org/alpine/aports so a single API
# (raw.githubusercontent.com + api.github.com) handles both. The `path:` field
# scopes the latest-commit lookup to a subdirectory, so unrelated aports
# churn does not trigger a pin bump.
dist:
  # Source for systemd units, default Caddyfile, welcome page, and the
  # deb install/remove scripts.
  caddy_dist:
    repo_url: "https://github.com/caddyserver/dist"
    branch: "master"
    commit: "836ff569ed513837874a3aa5441f6719622bb08c"
  # Source for the OpenRC init script and the apk pre-install hook.
  aports:
    repo_url: "https://github.com/alpinelinux/aports"
    branch: "master"
    path: "community/caddy"
    commit: "65ea66742129a8a7b4941bf9b582a939347c5c2a"
# Package registry settings used by ./release.sh.
# Auth tokens must come from environment variables — never hard-code them here.
#
# Both providers publish a Release tagged v<pkg_version> with binary/deb/apk
# attached as assets. The forgejo backend additionally uploads to its native
# package registries (generic/debian/alpine/container); the github backend
# additionally pushes the docker image to ghcr.io.
#
# The Forgejo instance URL, owner, and repo are auto-detected from the CI
# runner env (FORGEJO_SERVER_URL + FORGEJO_REPOSITORY, with GITHUB_* aliases
# as a fallback for older runners). Same for the GitHub owner/repo via
# GITHUB_REPOSITORY. For local invocations, the env vars must be exported
# manually — see README "Running release.sh locally".
#
# Token scopes:
#   forgejo (FORGEJO_TOKEN): write:package + write:repository
#   github  (GITHUB_TOKEN):  contents: write + packages: write
#
# The active provider can be overridden at runtime via RELEASE_PROVIDER
# (forgejo | github); each CI workflow sets it explicitly.
release:
  # Default backend when RELEASE_PROVIDER env var is unset. Either provider
  # can be driven from the corresponding workflow regardless of this default.
  provider: "forgejo"
  github:
    # Optional sub-package name under the auto-detected repo. When unset
    # the image is published as a top-level package named after
    # docker.image. When set, the repo prefix is added automatically
    # (the only form GitHub will auto-link to the repo).
    #
    # Resulting URL (owner "oltdaniel", repo "caddy-custom", docker.image
    # "caddy-custom"):
    #   unset      -> ghcr.io/oltdaniel/caddy-custom
    #                 (top-level package, auto-linked since name == repo)
    #   "server"   -> ghcr.io/oltdaniel/caddy-custom/server
    #                 (sub-package under the caddy-custom repo)
    container_subpackage: "caddy"
  # Generic registry (Forgejo only) — per-arch binary tarballs from out/.
  generic:
    package_name: "caddy-custom"
  # Debian registry (Forgejo only) — distribution/component path the .deb
  # files land under. Ignored by the github backend (deb files are uploaded
  # as Release assets instead).
  deb:
    distribution: "stable"
    component: "main"
  # Alpine registry (Forgejo only) — branch (e.g. "v3.23") and repository
  # name. Ignored by the github backend.
  apk:
    branch: "v3"
    repository: "caddy-custom"
# Architectures to build. Each entry produces one binary, optionally one deb,
# one apk, and one docker platform. Comment out architectures you do not need.
# Field reference:
#   name             — short label used in output paths
#   goos / goarch    — passed to Go via env vars
#   goarm            — only for 32-bit ARM (6 or 7); leave empty otherwise
#   nfpm_arch        — value placed in nfpm `arch:` (Go-style: amd64/arm6/arm7/...)
#   docker_platform  — buildx --platform value (omit to skip docker for this arch)
architectures:
  - name: amd64
    goos: linux
    goarch: amd64
    goarm: ""
    nfpm_arch: amd64
    docker_platform: linux/amd64
  - name: arm64
    goos: linux
    goarch: arm64
    goarm: ""
    nfpm_arch: arm64
    docker_platform: linux/arm64
