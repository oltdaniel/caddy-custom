name: Auto-update

on:
  schedule:
    # Patch Tuesday — second Tuesday of the month at 08:00 UTC.
    # GitHub cron has no "nth weekday" syntax, so run every Tuesday 8–14 of
    # the month and gate on day-of-month inside the job.
    - cron: "0 8 8-14 * 2"
    # Daily — catches new Caddy/plugin releases within 24h, no webhook needed.
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  # Daily cron and Patch-Tuesday cron can fire on the same day; serialize
  # so two runs don't race on the auto-update branch.
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # Explicit so manual re-runs from any other ref still rebase from main.
          ref: main
          fetch-depth: 0

      - name: Detect run kind
        id: kind
        run: |
          dom=$(date -u +%-d)
          dow=$(date -u +%u)  # 1=Mon..7=Sun
          if [[ "${dow}" == "2" && "${dom}" -ge 8 && "${dom}" -le 14 ]]; then
            echo "kind=patch-tuesday" >> "$GITHUB_OUTPUT"
          else
            echo "kind=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for updates
        id: check
        run: |
          if ./check-updates.sh --apply 2>/tmp/log.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Capture the human report for the PR body / comment
          ./check-updates.sh > /tmp/report.md 2>/dev/null || true
        continue-on-error: true

      - name: Read auto_update mode
        id: mode
        run: |
          mode=$(yq -r '.auto_update.mode // "pr"' build.yaml)
          branch=$(yq -r '.auto_update.branch // "auto-update"' build.yaml)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Apply (auto mode)
        if: steps.check.outputs.changed == 'true' && steps.mode.outputs.mode == 'auto'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.yaml lib/tools.pins.sh dist
          git commit -m "chore(auto-update): pin bumps (${{ steps.kind.outputs.kind }})"
          git push origin HEAD:main

      - name: Apply (PR mode)
        if: steps.check.outputs.changed == 'true' && steps.mode.outputs.mode == 'pr'
        env:
          BRANCH: ${{ steps.mode.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Reset the auto-update branch from main on every run so the PR diff
          # is always (current main) -> (single bump commit) — no accumulated
          # history, no merge conflicts when main moves on.
          git checkout -B "$BRANCH"
          git add build.yaml lib/tools.pins.sh dist
          git commit -m "chore(auto-update): pin bumps (${{ steps.kind.outputs.kind }})"
          git push origin "$BRANCH" --force

          # The PR body always shows the current report; each subsequent run
          # leaves a short timestamp-only comment so the thread doubles as a
          # chronological log of "when did this PR get refreshed".
          pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || echo "")
          if [[ -z "$pr" ]]; then
            gh pr create --head "$BRANCH" --base main \
              --title "Auto-update: pin bumps" \
              --body-file /tmp/report.md
          else
            gh pr edit "$pr" --body-file /tmp/report.md
            gh pr comment "$pr" --body "Refreshed at $(date -u +%Y-%m-%dT%H:%MZ) — ${{ steps.kind.outputs.kind }} run. Branch force-pushed; current report is in the PR description above."
          fi
