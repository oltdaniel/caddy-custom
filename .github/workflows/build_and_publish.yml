name: Build and publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Required for the auto version suffix (git rev-list --count HEAD).
          fetch-depth: 0

      - name: Check if version already published
        id: check
        env:
          RELEASE_PROVIDER: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "published=$(./release.sh check)" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Required for the auto version suffix (git rev-list --count HEAD).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Install missing packages
        run: sudo apt-get update && sudo apt-get install gettext -y

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build packages
        run: |
          ./build.sh all

      - name: Publish packages
        env:
          RELEASE_PROVIDER: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./release.sh
